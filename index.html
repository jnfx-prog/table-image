<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Paste & Export — Clipboard to Image</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f0f3f7;
            --card-bg: #ffffff;
            --accent: #4f6ef7;
            --accent-hover: #3b54e0;
            --accent-light: #eef1ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --border-dashed: #c7cdd4;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.10), 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.14), 0 8px 20px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(79, 110, 247, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(16, 185, 129, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.01) 0%, transparent 80%);
        }

        /* ─── Main Card ─────────────────────── */
        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 1100px;
            min-width: 340px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow var(--transition-slow), transform var(--transition-slow);
            animation: cardEntry 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .app-card.has-content {
            box-shadow: var(--shadow-xl);
        }

        /* ─── Header ───────────────────────── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
            background: #fafbfc;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform var(--transition-fast);
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .app-subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.01em;
            display: none;
        }

        @media (min-width: 500px) {
            .app-subtitle {
                display: inline;
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        /* ─── Toggle Options ────────────────── */
        .toggle-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            padding: 8px 12px;
            border-radius: 20px;
            background: #f0f3f7;
            border: 1.5px solid var(--border);
            transition: all var(--transition-fast);
        }

        .toggle-option:hover {
            background: #e4e8f0;
            color: var(--text);
            border-color: #c4c9d4;
        }

        .toggle-option input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* ─── Buttons ──────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            white-space: nowrap;
            letter-spacing: 0.01em;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            font-family: var(--font);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            opacity: 0;
            transition: opacity var(--transition-fast);
            pointer-events: none;
        }

        .btn:active::after {
            opacity: 0.12;
            background: currentColor;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(79, 110, 247, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(79, 110, 247, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(79, 110, 247, 0.25);
        }

        .btn-primary .btn-icon {
            width: 17px;
            height: 17px;
        }

        .btn-outline {
            background: #fff;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover {
            border-color: #c4c9d4;
            background: #f9fafb;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-outline:active {
            background: #f3f4f6;
            transform: scale(0.96);
        }

        .btn-outline .btn-icon {
            width: 16px;
            height: 16px;
        }

        /* ─── Display / Paste Area ─────────── */
        .display-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 320px;
            transition: min-height var(--transition);
        }

        .paste-zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 24px;
            border-radius: var(--radius);
            transition: all var(--transition);
            position: relative;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .paste-zone.idle {
            border: 2.5px dashed var(--border-dashed);
            background: #fafbfd;
            min-height: 260px;
        }

        .paste-zone.idle:hover {
            border-color: #b0b8c6;
            background: #f7f9fc;
            box-shadow: inset 0 0 0 1px rgba(79, 110, 247, 0.04);
        }

        .paste-zone.idle:focus-within,
        .paste-zone.idle:focus {
            border-color: var(--accent);
            background: #f8f9ff;
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.07), inset 0 0 0 1px rgba(79, 110, 247, 0.06);
        }

        .paste-zone.filled {
            border: 1.5px solid transparent;
            background: #fff;
            cursor: default;
            min-height: auto;
            margin: 16px 20px;
            padding: 4px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            animation: zoneFill 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        @keyframes zoneFill {
            from {
                box-shadow: var(--shadow-sm);
                border-color: var(--accent-light);
            }

            to {
                box-shadow: var(--shadow);
                border-color: transparent;
            }
        }

        .table-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 65vh;
            border-radius: 8px;
            scroll-behavior: smooth;
            transition: all var(--transition);
        }

        .table-viewport::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .table-viewport::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 3px;
        }

        .table-viewport::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        .table-viewport::-webkit-scrollbar-thumb:hover {
            background: #b0b7c3;
        }

        .table-viewport::-webkit-scrollbar-corner {
            background: transparent;
        }

        .table-display {
            padding: 12px 8px;
            display: inline-block;
            min-width: 100%;
            animation: contentFadeIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
            transform-origin: top center;
        }

        @keyframes contentFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .table-display.refresh-anim {
            animation: none;
        }

        .table-display.refresh-anim {
            animation: contentFadeIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        .table-display table {
            border-collapse: collapse;
            font-size: inherit;
            margin: 0 auto;
            background: #fff;
        }

        .table-display table td,
        .table-display table th {
            padding: 6px 10px;
            vertical-align: middle;
        }

        /* ─── Placeholder ──────────────────── */
        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: none;
            user-select: none;
            text-align: center;
            padding: 20px;
            transition: opacity var(--transition-fast);
        }

        .paste-zone.filled .placeholder-content {
            display: none;
        }

        .placeholder-icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .placeholder-icon-wrapper svg {
            width: 30px;
            height: 30px;
            color: var(--accent);
        }

        .placeholder-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .placeholder-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 320px;
        }

        .placeholder-kbd {
            display: inline-block;
            background: #eef1f6;
            border: 1px solid #dde1e8;
            border-radius: 5px;
            padding: 2px 8px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            margin: 0 2px;
            font-family: var(--font);
        }

        /* ─── Toast Notifications ──────────── */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .toast-container {
                bottom: 16px;
                right: 12px;
                left: 12px;
                align-items: stretch;
            }
        }

        .toast {
            background: #1e1e2e;
            color: #fff;
            padding: 13px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.01em;
            max-width: 400px;
            font-family: var(--font);
        }

        .toast.success {
            background: #065f46;
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.35);
        }

        .toast.warning {
            background: #78350f;
            box-shadow: 0 8px 28px rgba(245, 158, 11, 0.3);
        }

        .toast.info {
            background: #1e3a5f;
            box-shadow: 0 8px 28px rgba(79, 110, 247, 0.3);
        }

        .toast.out {
            animation: toastOut 0.3s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(14px) scale(0.88);
            }
        }

        .toast-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .toast.success .toast-dot {
            background: #34d399;
        }

        .toast.warning .toast-dot {
            background: #fbbf24;
        }

        .toast.info .toast-dot {
            background: #60a5fa;
        }

        /* ─── Capture flash overlay ────────── */
        .capture-flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 9998;
            transition: opacity 0.08s ease-out;
        }

        .capture-flash.active {
            opacity: 0.55;
            transition: opacity 0s;
        }

        .capture-ready {
            animation: none !important;
            transition: none !important;
            transform: none !important;
        }

        /* ─── Responsive ──────────────────── */
        @media (max-width: 640px) {
            .app-header {
                padding: 14px 16px;
                gap: 8px;
            }

            .app-title {
                font-size: 1rem;
            }

            .btn {
                padding: 8px 13px;
                font-size: 0.8rem;
                gap: 5px;
                border-radius: 22px;
            }

            .btn .btn-icon {
                width: 14px;
                height: 14px;
            }

            .paste-zone {
                margin: 12px 14px;
                border-radius: var(--radius-sm);
            }

            .paste-zone.idle {
                min-height: 200px;
            }

            .paste-zone.filled {
                margin: 10px 12px;
                border-radius: 8px;
            }

            .table-display {
                padding: 8px 4px;
            }

            .display-wrapper {
                min-height: 240px;
            }

            .placeholder-icon-wrapper {
                width: 50px;
                height: 50px;
            }

            .placeholder-icon-wrapper svg {
                width: 24px;
                height: 24px;
            }

            .placeholder-title {
                font-size: 0.95rem;
            }

            .placeholder-desc {
                font-size: 0.78rem;
                max-width: 260px;
            }
        }
    </style>
</head>

<body>

    <!-- ─── App Card ──────────────────────── -->
    <div class="app-card" id="appCard">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2.5" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="9" y1="3" x2="9" y2="21" />
                    </svg>
                </div>
                <span class="app-title">Table Paste &amp; Export</span>
                <span class="app-subtitle">· Clipboard to Image ni Jopring</span>
            </div>
            <div class="header-actions">
                <label class="toggle-option" title="Toggle visibility of hidden or filtered rows">
                    <input type="checkbox" id="chkIncludeHiddenRows">
                    <span>Include hidden rows</span>
                </label>
                <label class="toggle-option" title="Toggle visibility of hidden or filtered columns and cells">
                    <input type="checkbox" id="chkIncludeHiddenCols">
                    <span>Include hidden cols</span>
                </label>
                <button class="btn btn-outline" id="btnClear" title="Clear table (Esc)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <line x1="10" y1="10" x2="10" y2="18" />
                        <line x1="14" y1="10" x2="14" y2="18" />
                    </svg>
                    Clear
                </button>
                <button class="btn btn-primary" id="btnSaveImage" title="Save as PNG image (Ctrl+S)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Save Image
                </button>
            </div>
        </header>

        <!-- Display / Paste Area -->
        <div class="display-wrapper" id="displayWrapper">
            <div class="paste-zone idle" id="pasteZone" tabindex="0" role="region" aria-label="Paste area">
                <!-- Placeholder -->
                <div class="placeholder-content" id="placeholderContent">
                    <div class="placeholder-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="3" />
                            <line x1="3" y1="9" x2="21" y2="9" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                            <rect x="7" y="13" width="4" height="3" rx="0.5" fill="currentColor" opacity="0.35" />
                            <rect x="13" y="13" width="4" height="3" rx="0.5" fill="currentColor" opacity="0.35" />
                        </svg>
                    </div>
                    <span class="placeholder-title">Paste your table here</span>
                    <span class="placeholder-desc">
                        Copy from <strong>Excel</strong> or <strong>Google Sheets</strong>,<br>
                        then press <span class="placeholder-kbd">Ctrl</span>+<span class="placeholder-kbd">V</span>
                        or click here and paste.
                    </span>
                </div>
                <!-- Table viewport -->
                <div class="table-viewport" id="tableViewport" style="display:none;">
                    <div class="table-display" id="tableDisplay"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>
    <!-- Capture flash -->
    <div class="capture-flash" id="captureFlash"></div>

    <script>
        (function () {
            // ─── DOM References ──────────────────
            const appCard = document.getElementById('appCard');
            const pasteZone = document.getElementById('pasteZone');
            const placeholderContent = document.getElementById('placeholderContent');
            const tableViewport = document.getElementById('tableViewport');
            const tableDisplay = document.getElementById('tableDisplay');
            const btnClear = document.getElementById('btnClear');
            const btnSaveImage = document.getElementById('btnSaveImage');
            const chkIncludeHiddenRows = document.getElementById('chkIncludeHiddenRows');
            const chkIncludeHiddenCols = document.getElementById('chkIncludeHiddenCols');
            const toastContainer = document.getElementById('toastContainer');
            const captureFlash = document.getElementById('captureFlash');
            const displayWrapper = document.getElementById('displayWrapper');

            let hasContent = false;
            let rawPastedHTML = '';
            let currentTableHTML = '';
            let toastTimer = null;

            // Helper to detect hidden styles/attributes (works with inline and computed CSS)
            function isElementHidden(el) {
                if (el.hasAttribute('hidden')) return true;

                const style = el.getAttribute('style') || '';
                const heightAttr = el.getAttribute('height');
                const widthAttr = el.getAttribute('width');

                // Attribute/Inline Style inspection
                if (/display\s*:\s*none/i.test(style)) return true;
                if (/visibility\s*:\s*hidden/i.test(style)) return true;
                if (/height\s*:\s*0(px|pt|em|%)?/i.test(style) || heightAttr === '0') return true;
                if (/width\s*:\s*0(px|pt|em|%)?/i.test(style) || widthAttr === '0') return true;

                // Browser Computed Style inspection (when appended to DOM)
                const computed = window.getComputedStyle(el);
                if (computed.display === 'none') return true;
                if (computed.visibility === 'hidden') return true;
                if (parseFloat(computed.height) === 0) return true;
                if (parseFloat(computed.width) === 0) return true;

                return false;
            }

            // ─── Process Hidden Rows and Cells ──────────
            function processHTMLForHiddenCells(htmlString, includeRows, includeCols) {
                if (!htmlString) return '';

                // Mount temporary container into DOM so computed styles (from embedded <style> tags) work
                const container = document.createElement('div');
                container.style.position = 'absolute';
                container.style.left = '-9999px';
                container.style.top = '-9999px';
                container.style.visibility = 'hidden';
                container.innerHTML = htmlString;
                document.body.appendChild(container);

                try {
                    // 1. Process Hidden Rows (tr)
                    const rows = container.querySelectorAll('tr');
                    rows.forEach(tr => {
                        if (isElementHidden(tr)) {
                            if (!includeRows) {
                                tr.remove();
                            } else {
                                tr.style.display = 'table-row';
                                tr.style.visibility = 'visible';
                                tr.style.height = 'auto';
                                tr.style.maxHeight = 'none';
                                tr.removeAttribute('hidden');
                                if (tr.getAttribute('height') === '0') tr.removeAttribute('height');
                            }
                        }
                    });

                    // 2. Process Hidden Columns & Cells (td, th, col, colgroup)
                    const colsAndCells = container.querySelectorAll('td, th, col, colgroup');
                    colsAndCells.forEach(el => {
                        if (isElementHidden(el)) {
                            if (!includeCols) {
                                el.remove();
                            } else {
                                el.style.display = (el.tagName === 'TD' || el.tagName === 'TH') ? 'table-cell' : 'block';
                                el.style.visibility = 'visible';
                                el.style.height = 'auto';
                                el.style.width = 'auto';
                                el.removeAttribute('hidden');
                                if (el.getAttribute('height') === '0') el.removeAttribute('height');
                                if (el.getAttribute('width') === '0') el.removeAttribute('width');
                            }
                        }
                    });

                    return container.innerHTML;
                } finally {
                    document.body.removeChild(container);
                }
            }

            // ─── State Management ────────────────
            function setFilledState(html) {
                rawPastedHTML = html;
                const processedHTML = processHTMLForHiddenCells(
                    rawPastedHTML,
                    chkIncludeHiddenRows.checked,
                    chkIncludeHiddenCols.checked
                );
                currentTableHTML = processedHTML;
                tableDisplay.innerHTML = processedHTML;

                tableDisplay.classList.remove('refresh-anim');
                void tableDisplay.offsetWidth;
                tableDisplay.classList.add('refresh-anim');

                placeholderContent.style.display = 'none';
                tableViewport.style.display = 'block';
                pasteZone.classList.remove('idle');
                pasteZone.classList.add('filled');
                appCard.classList.add('has-content');
                pasteZone.style.cursor = 'default';
                hasContent = true;
                btnClear.style.display = '';
                btnSaveImage.style.display = '';

                requestAnimationFrame(() => {
                    tableViewport.scrollTop = 0;
                    tableViewport.scrollLeft = 0;
                });

                displayWrapper.style.minHeight = Math.max(180, tableDisplay.scrollHeight + 80) + 'px';
            }

            function setEmptyState() {
                rawPastedHTML = '';
                currentTableHTML = '';
                tableDisplay.innerHTML = '';
                placeholderContent.style.display = '';
                tableViewport.style.display = 'none';
                pasteZone.classList.add('idle');
                pasteZone.classList.remove('filled');
                appCard.classList.remove('has-content');
                pasteZone.style.cursor = 'pointer';
                hasContent = false;
                displayWrapper.style.minHeight = '320px';
            }

            // ─── Toggle Options Handlers ─────────
            function handleToggleChange(label, isChecked) {
                if (hasContent && rawPastedHTML) {
                    const processedHTML = processHTMLForHiddenCells(
                        rawPastedHTML,
                        chkIncludeHiddenRows.checked,
                        chkIncludeHiddenCols.checked
                    );
                    currentTableHTML = processedHTML;
                    tableDisplay.innerHTML = processedHTML;

                    showToast(`${label} ${isChecked ? 'included' : 'excluded'}`, 'info');
                }
            }

            chkIncludeHiddenRows.addEventListener('change', function () {
                handleToggleChange('Hidden rows', this.checked);
            });

            chkIncludeHiddenCols.addEventListener('change', function () {
                handleToggleChange('Hidden columns', this.checked);
            });

            // ─── Generate table from plain text (tab-separated) ──
            function textToTable(plainText) {
                const lines = plainText.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length === 0) return null;
                const rows = lines.map(line => line.split('\t'));
                const maxCols = Math.max(...rows.map(r => r.length));
                let html = '<table style="border-collapse: collapse; width: auto; font-size: 0.9rem;">';
                rows.forEach(row => {
                    html += '<tr>';
                    for (let i = 0; i < maxCols; i++) {
                        const cell = row[i] || '';
                        html +=
                            `<td style="border: 1px solid #d1d5db; padding: 6px 10px; white-space: nowrap;">${escapeHTML(cell)}</td>`;
                    }
                    html += '</tr>';
                });
                html += '</table>';
                return html;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ─── Clipboard Paste Handler ─────────
            function handlePaste(e) {
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' ||
                    activeEl.isContentEditable)) {
                    if (activeEl !== pasteZone && !pasteZone.contains(activeEl)) {
                        return;
                    }
                }

                const clipboardData = e.clipboardData;
                if (!clipboardData) return;

                const htmlData = clipboardData.getData('text/html');
                const plainText = clipboardData.getData('text/plain');

                if (!htmlData && !plainText) return;

                e.preventDefault();

                if (htmlData) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlData;
                    const tables = tempDiv.querySelectorAll('table');

                    if (tables.length > 0) {
                        const tableFragments = [];
                        tables.forEach((table) => {
                            const clonedTable = table.cloneNode(true);
                            const wrapper = document.createElement('div');
                            wrapper.style.marginBottom = tables.length > 1 ? '16px' : '0';
                            wrapper.appendChild(clonedTable);
                            tableFragments.push(wrapper.outerHTML);
                        });
                        // Preserve embedded <style> tags from Excel / Sheets if present
                        const styles = tempDiv.querySelectorAll('style');
                        let styleHTML = '';
                        styles.forEach(s => styleHTML += s.outerHTML);

                        setFilledState(styleHTML + tableFragments.join(''));
                        showToast('Table pasted successfully!', 'success');
                        return;
                    }
                }

                if (plainText && plainText.includes('\t')) {
                    const generatedTable = textToTable(plainText);
                    if (generatedTable) {
                        setFilledState(generatedTable);
                        showToast('Table reconstructed from tab‑separated text', 'info');
                        return;
                    }
                }

                if (plainText && plainText.trim()) {
                    const preHTML =
                        `<pre style="font-family: monospace; white-space: pre-wrap; padding: 16px; background: #f9fafb; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; color: #1a1a2e;">${escapeHTML(plainText.trim())}</pre>`;
                    setFilledState(preHTML);
                    showToast('Plain text pasted (no table structure detected)', 'info');
                }
            }

            // ─── Listeners ───────────────────────
            document.addEventListener('paste', handlePaste);
            pasteZone.addEventListener('paste', function (e) {
                if (!hasContent) pasteZone.focus();
            });
            pasteZone.addEventListener('click', function (e) {
                if (!hasContent) pasteZone.focus();
            });

            btnClear.addEventListener('click', function () {
                if (hasContent) {
                    tableDisplay.style.opacity = '0';
                    tableDisplay.style.transform = 'translateY(6px) scale(0.98)';
                    tableDisplay.style.transition = 'all 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
                    setTimeout(() => {
                        setEmptyState();
                        tableDisplay.style.opacity = '';
                        tableDisplay.style.transform = '';
                        tableDisplay.style.transition = '';
                        pasteZone.focus();
                        showToast('Table cleared', 'info');
                    }, 200);
                }
            });

            // ─── Save Image Button ───────────────
            btnSaveImage.addEventListener('click', function () {
                if (!hasContent || !currentTableHTML) {
                    showToast('Nothing to save. Paste a table first.', 'warning');
                    return;
                }

                captureFlash.classList.add('active');
                setTimeout(() => captureFlash.classList.remove('active'), 120);

                const originalHTML = btnSaveImage.innerHTML;
                btnSaveImage.innerHTML = `
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="animation: spin 0.8s linear infinite;">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="32 12" stroke-linecap="round"/>
                    </svg>
                    Saving...
                `;
                btnSaveImage.style.pointerEvents = 'none';
                btnSaveImage.style.opacity = '0.8';

                if (!document.getElementById('spin-keyframe')) {
                    const styleEl = document.createElement('style');
                    styleEl.id = 'spin-keyframe';
                    styleEl.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
                    document.head.appendChild(styleEl);
                }

                tableDisplay.classList.add('capture-ready');

                const tableClone = tableDisplay.cloneNode(true);
                tableClone.style.position = 'absolute';
                tableClone.style.top = '-9999px';
                tableClone.style.left = '-9999px';
                tableClone.style.padding = '0';
                tableClone.style.margin = '0';
                tableClone.style.width = 'max-content';
                tableClone.style.minWidth = 'auto';
                tableClone.style.maxWidth = 'none';
                tableClone.style.height = 'auto';
                tableClone.style.display = 'inline-block';

                tableClone.querySelectorAll('*').forEach((el) => {
                    el.style.marginLeft = '0';
                    el.style.marginRight = '0';
                });

                document.body.appendChild(tableClone);

                requestAnimationFrame(() => {
                    html2canvas(tableClone, {
                        scale: 3,
                        backgroundColor: '#ffffff',
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                    }).then((canvas) => {
                        canvas.toBlob((blob) => {
                            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                            const filename = `table-export-${timestamp}.png`;
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            showToast('Image saved! 📸 ' + filename, 'success');
                        }, 'image/png', 1.0);
                    }).catch((err) => {
                        console.error('html2canvas error:', err);
                        showToast('Failed to capture image. Try again.', 'warning');
                    }).finally(() => {
                        document.body.removeChild(tableClone);
                        tableDisplay.classList.remove('capture-ready');
                        btnSaveImage.innerHTML = originalHTML;
                        btnSaveImage.style.pointerEvents = '';
                        btnSaveImage.style.opacity = '';
                    });
                });
            });

            // ─── Toast System ───────────────────
            function showToast(message, type = 'info') {
                if (toastTimer) clearTimeout(toastTimer);
                const existingToasts = toastContainer.querySelectorAll('.toast');
                if (existingToasts.length >= 2) {
                    const oldest = existingToasts[existingToasts.length - 1];
                    oldest.classList.add('out');
                    setTimeout(() => oldest.remove(), 300);
                }
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const dotColor = type === 'success' ? '#34d399' : type === 'warning' ? '#fbbf24' : '#60a5fa';
                toast.innerHTML = `<span class="toast-dot" style="background:${dotColor};"></span>${message}`;
                toastContainer.appendChild(toast);
                toastTimer = setTimeout(() => {
                    toast.classList.add('out');
                    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
                }, 2800);
            }

            // ─── Keyboard Shortcuts ─────────────
            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    if (hasContent) {
                        e.preventDefault();
                        btnSaveImage.click();
                    }
                }
                if (e.key === 'Escape' && hasContent) {
                    const activeEl = document.activeElement;
                    if (!activeEl || (activeEl.tagName !== 'INPUT' && activeEl.tagName !== 'TEXTAREA' && !activeEl
                        .isContentEditable)) {
                        e.preventDefault();
                        btnClear.click();
                    }
                }
            });

            // ─── Initialization ─────────────────
            setEmptyState();
            btnClear.style.display = '';
            btnSaveImage.style.display = '';
            setTimeout(() => {
                if (!hasContent) pasteZone.focus();
            }, 600);
        })();
    </script>
</body>

</html>
