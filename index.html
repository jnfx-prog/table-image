(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Paste & Export — Clipboard to Image</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f0f3f7;
            --card-bg: #ffffff;
            --accent: #4f6ef7;
            --accent-hover: #3b54e0;
            --accent-light: #eef1ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --border-dashed: #c7cdd4;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.10), 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.14), 0 8px 20px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width:100%; max-width:1100px; min-width:340px;
            display:flex; flex-direction:column; overflow:hidden;
        }
        .app-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:18px 24px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; background:#fafbfc;
        }
        .header-left{display:flex; align-items:center; gap:10px;}
        .logo-icon{width:38px; height:38px; border-radius:10px; background:var(--accent-light); display:flex; align-items:center; justify-content:center;}
        .app-title{font-size:1.15rem; font-weight:700; color:var(--text);}
        .header-actions{display:flex; align-items:center; gap:10px;}
        /* EXPORT OPTIONS - NEW */
        .export-options {
            display:flex; gap:12px; align-items:center; flex-wrap:wrap;
            padding:12px 24px; border-bottom:1px solid var(--border);
            background:#fcfdff;
        }
        .export-options .toggle {
            display:inline-flex; align-items:center; gap:7px;
            font-size:0.84rem; font-weight:600; color:var(--text);
            cursor:pointer; user-select:none;
            padding:7px 12px; border-radius:20px;
            background:var(--bg); border:1px solid var(--border);
            transition: all var(--transition-fast);
        }
        .export-options .toggle:hover{border-color:var(--accent); background:var(--accent-light);}
        .export-options .toggle input{accent-color:var(--accent); width:14px; height:14px;}
        .export-options .hint{font-size:0.75rem; color:var(--text-secondary); margin-left:auto;}
        .btn {
            display:inline-flex; align-items:center; gap:7px;
            padding:10px 16px; border-radius:25px; font-size:0.875rem; font-weight:600;
            cursor:pointer; border:none; white-space:nowrap; transition:all var(--transition-fast);
            font-family:var(--font);
        }
        .btn-primary{background:var(--accent); color:white;}
        .btn-primary:hover{background:var(--accent-hover);}
        .btn-ghost{background:var(--bg); color:var(--text-secondary); border:1px solid var(--border);}
        .btn-ghost:hover{background:white;}
        .paste-zone {
            border:2px dashed var(--border-dashed); border-radius:var(--radius);
            margin:24px; padding:48px 24px; text-align:center; color:var(--text-secondary);
            cursor:text; outline:none; min-height:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
        }
        .paste-zone:focus{border-color:var(--accent); background:var(--accent-light);}
        .table-display{padding:0 24px 24px; overflow:auto; max-height:65vh;}
        .table-display table{border-collapse:collapse; width:100%; background:white;}
        .table-display th, .table-display td{border:1px solid var(--border); padding:8px 12px; text-align:left; font-size:0.9rem;}
        .table-display th{background:#f8fafc; font-weight:700;}
        /* capture ready - disable transforms */
        .capture-ready{transform:none !important; animation:none !important;}
        .toast-container{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:9999;}
        .toast{background:#1f2937; color:white; padding:10px 14px; border-radius:10px; font-size:0.85rem; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow-lg);}
        .toast-dot{width:8px; height:8px; border-radius:50%;}
        .toast.out{opacity:0; transform:translateY(8px); transition:all 0.3s;}
        .capture-flash{position:fixed; inset:0; background:white; opacity:0; pointer-events:none; z-index:9998; transition:opacity 0.12s;}
        .capture-flash.active{opacity:0.7;}
    </style>
</head>
<body>
    <div class="app-card" id="appCard">
        <div class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </div>
                <div class="app-title">Table Paste & Export</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" id="btnClear">Clear</button>
                <button class="btn btn-ghost" id="btnCopy">Copy Table</button>
                <button class="btn btn-primary" id="btnSaveImage">Save as Image</button>
            </div>
        </div>

        <!-- NEW OPTIONS -->
        <div class="export-options" id="exportOptions">
            <label class="toggle" title="If checked, rows hidden via display:none, visibility:hidden, height 0 or Excel hidden rows will not be copied or exported">
                <input type="checkbox" id="excludeHiddenRows" checked>
                Exclude hidden rows
            </label>
            <label class="toggle" title="If checked, cells/columns hidden via display:none or filtered out will not be copied or exported">
                <input type="checkbox" id="excludeFilteredCells" checked>
                Exclude filtered / hidden cells
            </label>
            <span class="hint">Applies to Copy & Save as Image & Ctrl+C from table</span>
        </div>

        <div class="paste-zone" id="pasteZone" contenteditable="true" tabindex="0">
            <strong>Paste your table here</strong>
            <span>Ctrl+V from Excel / Sheets / HTML</span>
            <small style="opacity:0.6">Hidden rows will be preserved but can be excluded on export</small>
        </div>
        <div class="table-display" id="tableDisplay" style="display:none;"></div>
    </div>
    <div class="capture-flash" id="captureFlash"></div>
    <div class="toast-container" id="toastContainer"></div>

<script>
(function(){
    const pasteZone = document.getElementById('pasteZone');
    const tableDisplay = document.getElementById('tableDisplay');
    const btnClear = document.getElementById('btnClear');
    const btnCopy = document.getElementById('btnCopy');
    const btnSaveImage = document.getElementById('btnSaveImage');
    const toastContainer = document.getElementById('toastContainer');
    const captureFlash = document.getElementById('captureFlash');
    const excludeHiddenRowsEl = document.getElementById('excludeHiddenRows');
    const excludeFilteredEl = document.getElementById('excludeFilteredCells');
    const appCard = document.getElementById('appCard');

    let hasContent = false;
    let toastTimer = null;

    // ─── Helpers: hidden detection ─────────────────────────────
    function isElementHiddenByStyle(el){
        if (!el) return false;
        if (el.hasAttribute && el.hasAttribute('hidden')) return true;
        if (el.getAttribute && el.getAttribute('aria-hidden') === 'true') return true;
        // Check inline style string for Excel
        const styleAttr = (el.getAttribute && el.getAttribute('style') || '').toLowerCase();
        if (styleAttr.includes('display:none') || styleAttr.includes('display: none')) return true;
        if (styleAttr.includes('visibility:hidden') || styleAttr.includes('visibility: hidden')) return true;
        if (styleAttr.includes('mso-hide:all')) return true;

        // computed style - only if attached to DOM
        try {
            const cs = window.getComputedStyle(el);
            if (cs.display === 'none') return true;
            if (cs.visibility === 'hidden') return true;
            if (cs.visibility === 'collapse') return true;
        } catch(e){}
        if (el.style && el.style.display === 'none') return true;
        if (el.style && el.style.visibility === 'hidden') return true;
        return false;
    }

    function isRowHidden(tr){
        if (isElementHiddenByStyle(tr)) return true;
        // Excel filtered rows sometimes have height 0 and no client rects
        if (tr.offsetParent === null) {
            const rects = tr.getClientRects();
            if (rects.length === 0) return true;
        }
        if (tr.offsetHeight === 0 && tr.offsetWidth === 0) {
            // if it has content but zero size, treat as hidden
            const text = tr.textContent.trim();
            if (text.length > 0) return true;
        }
        // If all cells hidden, row is effectively hidden
        const cells = tr.cells ? [...tr.cells] : [];
        if (cells.length > 0 && cells.every(c => isElementHiddenByStyle(c))) return true;
        // data-filtered custom
        if (tr.dataset && (tr.dataset.hidden === 'true' || tr.dataset.filtered === 'true')) return true;
        return false;
    }

    function isCellHidden(cell){
        if (isElementHiddenByStyle(cell)) return true;
        if (cell.offsetParent === null && cell.getClientRects().length === 0) {
            // still hidden if style says so
            return true;
        }
        return false;
    }

    // ─── Build filtered clone ─────────────────────────────────
    function buildFilteredTableClone(){
        const sourceTable = tableDisplay.querySelector('table');
        if (!sourceTable) return null;

        // We clone to avoid touching original computed styles detection
        const clone = sourceTable.cloneNode(true);

        const origRows = [...sourceTable.querySelectorAll('tr')];
        const cloneRows = [...clone.querySelectorAll('tr')];

        // First pass: remove hidden rows
        if (excludeHiddenRowsEl.checked) {
            cloneRows.forEach((cTr, i) => {
                const oTr = origRows[i];
                if (!oTr) return;
                if (isRowHidden(oTr)) {
                    cTr.setAttribute('data-remove', 'row-hidden');
                }
            });
        }

        // Also handle filtered rows marked via Excel (same as hidden, but separate toggle if user wants)
        // For filtered cells toggle, we mark hidden cells
        if (excludeFilteredEl.checked) {
            // need to walk per row to map cells
            origRows.forEach((oTr, rIdx) => {
                const cTr = cloneRows[rIdx];
                if (!cTr || cTr.getAttribute('data-remove')) return;
                const oCells = [...oTr.children].filter(el => el.tagName === 'TD' || el.tagName === 'TH');
                const cCells = [...cTr.children].filter(el => el.tagName === 'TD' || el.tagName === 'TH');
                oCells.forEach((oCell, cIdx) => {
                    const cCell = cCells[cIdx];
                    if (!cCell) return;
                    if (isCellHidden(oCell)) {
                        cCell.setAttribute('data-remove', 'cell-hidden');
                    }
                });
            });
        }

        // Actually remove
        clone.querySelectorAll('[data-remove="row-hidden"]').forEach(el => el.remove());
        if (excludeFilteredEl.checked) {
            clone.querySelectorAll('[data-remove="cell-hidden"]').forEach(el => el.remove());
        }

        // Clean up empty rows left after cell removal
        clone.querySelectorAll('tr').forEach(tr => {
            if (tr.children.length === 0) tr.remove();
        });

        return clone;
    }

    function getFilteredTableHTMLAndText(){
        const filtered = buildFilteredTableClone();
        if (!filtered) return null;
        const html = filtered.outerHTML;
        const text = [...filtered.querySelectorAll('tr')].map(tr => {
            const cells = [...tr.querySelectorAll('th, td')];
            return cells.map(c => c.innerText.replace(/\t/g,' ')).join('\t');
        }).join('\n');
        return {html, text, tableEl: filtered};
    }

    // ─── Paste Handling ───────────────────────────────────────
    function setEmptyState(){
        hasContent = false;
        tableDisplay.style.display = 'none';
        pasteZone.style.display = 'flex';
        appCard.classList.remove('has-content');
    }

    function setHasContent(){
        hasContent = true;
        pasteZone.style.display = 'none';
        tableDisplay.style.display = 'block';
        appCard.classList.add('has-content');
    }

    pasteZone.addEventListener('paste', (e) => {
        e.preventDefault();
        const htmlData = e.clipboardData.getData('text/html');
        const textData = e.clipboardData.getData('text/plain');

        let table = null;

        if (htmlData) {
            const div = document.createElement('div');
            div.innerHTML = htmlData;
            table = div.querySelector('table');
            if (!table) {
                // try to build from div with many divs? fallback to text
            }
        }

        if (!table && textData) {
            // Build table from TSV (Excel copies as tab separated)
            const rows = textData.trim().split(/\r?\n/);
            table = document.createElement('table');
            const tbody = document.createElement('tbody');
            rows.forEach(r => {
                const tr = document.createElement('tr');
                // preserve empty cells, but don't create hidden rows here
                r.split('\t').forEach(cellText => {
                    const td = document.createElement('td');
                    td.textContent = cellText;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

        if (table) {
            // Keep hidden styles! Do NOT strip display:none
            // Clean up unwanted attributes but keep display/visibility
            tableDisplay.innerHTML = '';
            tableDisplay.appendChild(table);
            setHasContent();
            showToast('Table pasted. ' + table.querySelectorAll('tr').length + ' rows', 'info');
        } else {
            showToast('No table found in clipboard', 'warning');
        }
    });

    // ─── Copy Handling (button + native Ctrl+C) ───────────────
    function copyTable(){
        if (!hasContent) { showToast('Nothing to copy','warning'); return; }

        const data = getFilteredTableHTMLAndText();
        if (!data) { showToast('Failed to prepare table','warning'); return; }

        // Use Clipboard API with HTML
        const blobHtml = new Blob([data.html], {type:'text/html'});
        const blobText = new Blob([data.text], {type:'text/plain'});
        const item = new ClipboardItem({
            'text/html': blobHtml,
            'text/plain': blobText
        });

        navigator.clipboard.write([item]).then(() => {
            const excludedCount = tableDisplay.querySelectorAll('table tr').length - data.tableEl.querySelectorAll('tr').length;
            let msg = 'Table copied!';
            if (excludedCount > 0 && excludeHiddenRowsEl.checked) {
                msg += ` (${excludedCount} hidden row(s) excluded)`;
            }
            showToast(msg + ' 📋', 'success');
        }).catch(() => {
            // Fallback
            navigator.clipboard.writeText(data.text).then(()=>{
                showToast('Table copied as text (fallback) 📋','success');
            });
        });
    }

    btnCopy.addEventListener('click', copyTable);

    // Intercept native copy from tableDisplay to respect options
    tableDisplay.addEventListener('copy', (e) => {
        if (!excludeHiddenRowsEl.checked && !excludeFilteredEl.checked) return; // let browser handle
        const data = getFilteredTableHTMLAndText();
        if (!data) return;
        e.preventDefault();
        e.clipboardData.setData('text/html', data.html);
        e.clipboardData.setData('text/plain', data.text);
        showToast('Copied (hidden excluded) 📋','success');
    });

    // ─── Clear ────────────────────────────────────────────────
    btnClear.addEventListener('click', () => {
        tableDisplay.innerHTML = '';
        setEmptyState();
        pasteZone.focus();
        showToast('Cleared','info');
    });

    // ─── Save as Image (with hidden exclusion) ───────────────
    btnSaveImage.addEventListener('click', () => {
        if (!hasContent) { showToast('Nothing to export','warning'); return; }

        captureFlash.classList.add('active');
        setTimeout(() => captureFlash.classList.remove('active'), 120);

        const originalHTML = btnSaveImage.innerHTML;
        btnSaveImage.innerHTML = `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="animation: spin 0.8s linear infinite;"><circle cx="12" cy="12" r="10" stroke-dasharray="32 12" stroke-linecap="round"/></svg> Saving...`;
        btnSaveImage.style.pointerEvents = 'none';
        btnSaveImage.style.opacity = '0.8';

        if (!document.getElementById('spin-keyframe')) {
            const styleEl = document.createElement('style');
            styleEl.id = 'spin-keyframe';
            styleEl.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
            document.head.appendChild(styleEl);
        }

        tableDisplay.classList.add('capture-ready');

        // Build filtered clone for capture
        const filteredTable = buildFilteredTableClone();
        const tableCloneWrapper = document.createElement('div');
        // match original tableDisplay styles but tight
        tableCloneWrapper.style.position = 'absolute';
        tableCloneWrapper.style.top = '-9999px';
        tableCloneWrapper.style.left = '-9999px';
        tableCloneWrapper.style.padding = '16px';
        tableCloneWrapper.style.margin = '0';
        tableCloneWrapper.style.width = 'max-content';
        tableCloneWrapper.style.minWidth = 'auto';
        tableCloneWrapper.style.maxWidth = 'none';
        tableCloneWrapper.style.height = 'auto';
        tableCloneWrapper.style.display = 'inline-block';
        tableCloneWrapper.style.background = '#ffffff';
        tableCloneWrapper.style.borderRadius = '12px';
        if (filteredTable) {
            tableCloneWrapper.appendChild(filteredTable);
        } else {
            tableCloneWrapper.innerHTML = tableDisplay.innerHTML;
        }

        document.body.appendChild(tableCloneWrapper);

        requestAnimationFrame(() => {
            html2canvas(tableCloneWrapper, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true,
                allowTaint: true,
                logging: false,
            }).then((canvas) => {
                canvas.toBlob((blob) => {
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0,19);
                    const filename = `table-export-${timestamp}.png`;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Image saved! 📸 ' + filename, 'success');
                }, 'image/png', 1.0);
            }).catch((err)=>{
                console.error('html2canvas error:', err);
                showToast('Failed to capture image. Try again.','warning');
            }).finally(()=>{
                document.body.removeChild(tableCloneWrapper);
                tableDisplay.classList.remove('capture-ready');
                btnSaveImage.innerHTML = originalHTML;
                btnSaveImage.style.pointerEvents = '';
                btnSaveImage.style.opacity = '';
            });
        });
    });

    // ─── Toast ────────────────────────────────────────────────
    function showToast(message, type='info'){
        if (toastTimer) clearTimeout(toastTimer);
        const existingToasts = toastContainer.querySelectorAll('.toast');
        if (existingToasts.length >= 2){
            const oldest = existingToasts[existingToasts.length-1];
            oldest.classList.add('out');
            setTimeout(()=>oldest.remove(),300);
        }
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const dotColor = type==='success'?'#34d399': type==='warning'?'#fbbf24':'#60a5fa';
        toast.innerHTML = `<span class="toast-dot" style="background:${dotColor};"></span>${message}`;
        toastContainer.appendChild(toast);
        toastTimer = setTimeout(()=>{
            toast.classList.add('out');
            setTimeout(()=>{if(toast.parentNode) toast.remove();},300);
        },2800);
    }

    document.addEventListener('keydown', function(e){
        if ((e.ctrlKey||e.metaKey) && e.key==='s'){
            if (hasContent){ e.preventDefault(); btnSaveImage.click(); }
        }
        if (e.key==='Escape' && hasContent){
            const activeEl = document.activeElement;
            if (!activeEl || (activeEl.tagName!=='INPUT' && activeEl.tagName!=='TEXTAREA' && !activeEl.isContentEditable)){
                e.preventDefault(); btnClear.click();
            }
        }
    });

    setEmptyState();
    btnClear.style.display = '';
    btnSaveImage.style.display = '';
    setTimeout(()=>{ if(!hasContent) pasteZone.focus(); },600);
    console.log('📋 Table Paste & Export ready (v4 – exclude hidden/filtered)');
})();
</script>
</body>
</html>
